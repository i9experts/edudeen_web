<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#174771" />
    <title>Edudeen - offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #fff; color: #1d2b36; text-align: center; padding: 24px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #5b6b76; margin: 0 0 20px; }
      button { font: inherit; padding: 10px 20px; border-radius: 8px; border: 0; background: #174771; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Edudeen needs an internet connection to load resources. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
