<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#174771" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Edudeen — Educational resources, books &amp; courses from trusted sellers</title>
    <meta name="description" content="Edudeen is an education marketplace: worksheets, books, digital downloads and courses for home and classroom from verified sellers." />
    <link rel="canonical" href="https://edudeen.com/" />
    <meta property="og:site_name" content="Edudeen" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Edudeen — Educational resources from trusted sellers" />
    <meta property="og:description" content="Worksheets, books, digital downloads and courses for home and classroom." />
    <meta property="og:image" content="https://edudeen.com/edudeen-logo.png" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {"@context":"https://schema.org","@graph":[
        {"@type":"Organization","name":"Edudeen","url":"https://edudeen.com/","logo":"https://edudeen.com/edudeen-logo.png"},
        {"@type":"WebSite","name":"Edudeen","url":"https://edudeen.com/","potentialAction":{"@type":"SearchAction","target":"https://edudeen.com/?search={search_term_string}","query-input":"required name=search_term_string"}}
      ]}
    </script>
    <style>
      #splash{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#fff;transition:opacity .28s ease}
      #splash.hide{opacity:0;pointer-events:none}
      #splash img{width:min(220px,56vw);height:auto;animation:edsp-pulse 1.4s ease-in-out infinite}
      #splash .bar{width:min(160px,42vw);height:3px;border-radius:3px;background:#e3ebf3;overflow:hidden}
      #splash .bar i{display:block;width:40%;height:100%;border-radius:3px;background:#174771;animation:edsp-slide 1.1s ease-in-out infinite}
      @keyframes edsp-pulse{0%,100%{opacity:.78;transform:scale(.98)}50%{opacity:1;transform:scale(1)}}
      @keyframes edsp-slide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
      @media (prefers-reduced-motion:reduce){#splash img,#splash .bar i{animation:none}}
    </style>  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Edudeen"><img src="/edudeen-logo.png" alt="Edudeen" width="220" height="auto" /><div class="bar"><i></i></div></div>    <div id="root"></div>
    <noscript>Edudeen needs JavaScript to run. Browse worksheets, books and courses at edudeen.com.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
